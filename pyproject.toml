[project]
name = "gene-tsp"
version = "2.0.0"
description = "High-performance genetic algorithm library for the Traveling Salesman Problem"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Pedro Larotta" }
]
requires-python = ">=3.10"
keywords = [
    "genetic-algorithm",
    "traveling-salesman",
    "tsp",
    "optimization",
    "evolutionary-computation",
    "nsga2",
    "multi-objective",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "numba>=0.55.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
    "PyQt6>=6.0.0",
]

[project.optional-dependencies]
gpu = [
    "cupy>=10.0.0",
]
tracking = [
    "wandb>=0.12.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "gene-tsp[tracking,dev]",
]

[project.scripts]
gene-tsp = "main:main"

[project.urls]
Homepage = "https://github.com/plarotta/genetic-traveling-salesperson"
Repository = "https://github.com/plarotta/genetic-traveling-salesperson"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gene_tsp", "data", "benchmarks"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gene_tsp"
